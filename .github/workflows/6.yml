name: Build and Deploy to vercelhome (Private Repo)

on:
  push:
    branches:
      - dev
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest  # ✅ 换成 Ubuntu 避免认证问题

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      - name: Copy .env.example if no .env exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Clone private deploy repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone https://${DEPLOY_TOKEN}@github.com/hwxlikemi/vercelhome.git deploy_repo

      - name: Clear old files
        run: |
          rm -rf deploy_repo/*
          cp -r dist/* deploy_repo/

      - name: Commit and push
        working-directory: deploy_repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Deploy from $GITHUB_REPOSITORY@$GITHUB_SHA" || echo "Nothing to commit"
          git push origin main
