name: Build and Deploy to vercelhome

on:
  push:
    branches:
      - dev
      - master

jobs:
  build_and_deploy:
    runs-on: windows-latest

    steps:
      # 1. 拉取当前仓库代码
      - name: Checkout source repository
        uses: actions/checkout@v4

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"

      # 3. 复制 .env 文件（如果没有）
      - name: Copy .env.example if no .env exists
        run: |
          if (-not (Test-Path .env)) {
            Copy-Item .env.example .env
          } else {
            Write-Host ".env exists, skipping copy"
          }

      # 4. 安装依赖
      - name: Install dependencies
        run: npm install

      # 5. 构建项目
      - name: Build project
        run: npm run build

      # 6. Clone 目标仓库（vercelhome）
      - name: Clone deploy repository
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git clone https://${DEPLOY_TOKEN}@github.com/hwxlikemi/vercelhome.git deploy_repo

      # 7. 清空目标仓库旧内容
      - name: Clean deploy repository files
        run: |
          Remove-Item -Recurse -Force deploy_repo\* 

      # 8. 复制构建产物到目标仓库
      - name: Copy build output to deploy repo
        run: |
          Copy-Item -Recurse dist\* deploy_repo\

      # 9. 提交并推送到目标仓库
      - name: Commit and push changes
        working-directory: deploy_repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Deploy updated website from $GITHUB_SHA" || echo "No changes to commit"
          git push origin main
